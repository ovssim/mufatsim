name: Build TF2 simulator and update images
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 7 * * 1'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Steam item image cache (optional)
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        shell: bash
        run: |
          if [[ -n "$STEAM_API_KEY" ]]; then
            python scripts/update_images.py || echo '::warning::Steam schema failed; retaining included image manifest.'
          else
            echo '::notice::STEAM_API_KEY is missing; fallback image resolver stays active.'
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy GitHub Pages (includes freshly generated JSON)
        id: deployment
        uses: actions/deploy-pages@v4
