name: Deploy TF2 simulator (images and case collections)
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 7 * * 1'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public catalog parser
        run: python -m pip install beautifulsoup4
      - name: Generate item image map from public schema (no secret required)
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          python scripts/update_images.py || echo '::warning::Image refresh failed; included fallback remains available.'
      - name: Import actual historical numbered crate drop pools and community estimates
        run: |
          python scripts/update_historical_crates.py || echo '::warning::Historical crate refresh failed; bundled verified tables remain available.'
      - name: Generate cosmetic and decorated weapon case contents
        run: |
          python scripts/update_cases.py || echo '::warning::Collection refresh failed; bundled case list remains available.'
      - name: Resolve missing legacy hats, tools, paint and key images
        run: |
          python scripts/update_wiki_images.py || echo '::warning::Wiki image lookup failed; existing image map kept.'
      - name: Update optional backpack.tf suggested price cache
        env:
          BACKPACK_TF_API_KEY: ${{ secrets.BACKPACK_TF_API_KEY }}
          TF2_KEY_REF: '65.88'
        run: |
          python scripts/update_backpack_prices.py || echo '::warning::Price refresh failed; keeping simulator fallbacks.'
      - uses: actions/configure-pages@v5
      # An artifact name unique to each run attempt prevents duplicate-name
      # failures when GitHub Actions jobs are rerun.
      - uses: actions/upload-pages-artifact@v4
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: '.'
      - name: Deploy GitHub Pages with freshly generated maps
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
